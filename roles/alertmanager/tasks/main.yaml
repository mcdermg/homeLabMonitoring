---
- name: Install alertmanager
  ansible.builtin.apt:
    name: prometheus-alertmanager
    state: present
  when: '"prometheus-alertmanager" not in ansible_facts.packages'

- name: Add alertmanager config
  ansible.builtin.template:
    src: alertmanager.yml.js
    dest: /etc/prometheus/alertmanager.yml
    owner: root
    group: root
    mode: '644'
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

- name: Add alerts config
  ansible.builtin.template:
    src: alert.yml.js
    dest: /etc/prometheus/alert.yml
    owner: root
    group: root
    mode: '644'
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

# Prometheus evaluates the rules, not Alertmanager, so it has to reread alert.yml
- name: Reload Prometheus to pick up the alert rules
  ansible.builtin.service:
    name: prometheus
    state: reloaded
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

- name: Add message template config
  ansible.builtin.copy:
    src: notifications.tmpl
    dest: /etc/prometheus/notifications.tmpl
    owner: root
    group: root
    mode: '644'
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

- name: Enable alertmanager service
  ansible.builtin.service:
    name: prometheus-alertmanager
    enabled: true
    state: restarted
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

- name: Check Alertmanager ready
  ansible.builtin.uri:
    url: http://{{ ansible_host }}:9093/-/ready
    return_content: true
  register: alertmanager_ready
  until: alertmanager_ready.status == 200 and "OK" in alertmanager_ready.content
  retries: 10
  delay: 5
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)

- name: Check Alertmanager health
  ansible.builtin.uri:
    url: http://{{ ansible_host }}:9093/-/healthy
    return_content: true
  register: alertmanager_health
  until: alertmanager_health.status == 200 and "OK" in alertmanager_health.content
  retries: 5
  delay: 5
  when: ("prometheus-alertmanager" not in ansible_facts.packages) or
        (force_alert_config | bool)
